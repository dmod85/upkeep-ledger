<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Upkeep Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
img{max-width:100%}
/* Layout: a single-column workshop ledger. Status gauges up top, then the due list sorted by urgency; details open in a sheet. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e6eaef; --ink:#15202b; --ink-2:#4b5967; --line:#d2d9e0;
  --accent:#1c5b89; --accent-ink:#ffffff; --accent-soft:#dbe8f3;
  --over:#b42318; --over-bg:#fde7e4; --soon:#9a5b00; --soon-bg:#fff1d6; --ok:#2b7a4b; --ok-bg:#e2f2e8; --none:#5f6b78; --none-bg:#e7ebef;
  --shadow:0 1px 2px rgba(21,32,43,.06),0 4px 16px rgba(21,32,43,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#16202a; --surface-2:#1e2a36; --ink:#e5ecf2; --ink-2:#9db0c1; --line:#2b3948;
  --accent:#6cb0e3; --accent-ink:#0a1621; --accent-soft:#1b3349;
  --over:#ff8f84; --over-bg:#3b1a18; --soon:#f0b552; --soon-bg:#382a10; --ok:#72d39c; --ok-bg:#132f20; --none:#93a2b1; --none-bg:#222e3a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#16202a; --surface-2:#1e2a36; --ink:#e5ecf2; --ink-2:#9db0c1; --line:#2b3948;
  --accent:#6cb0e3; --accent-ink:#0a1621; --accent-soft:#1b3349;
  --over:#ff8f84; --over-bg:#3b1a18; --soon:#f0b552; --soon-bg:#382a10; --ok:#72d39c; --ok-bg:#132f20; --none:#93a2b1; --none-bg:#222e3a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand{min-width:0;flex:1 1 320px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.sub{margin:6px 0 0;color:var(--ink-2);max-width:60ch}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:6px 11px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.ghost:hover{border-color:var(--line)}
.btn.danger{color:var(--over)}
.btn.danger.armed{background:var(--over);color:var(--surface);border-color:var(--over)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.top-actions{display:flex;flex-wrap:wrap;gap:8px}
.inline{display:flex;gap:8px;align-items:center}
.inline input{flex:1;min-width:0}
.hrow.member{grid-template-columns:minmax(0,1fr) auto auto;align-items:center}
.add-card{border-style:dashed;box-shadow:none;cursor:pointer;align-items:center;justify-content:center;min-height:150px;color:var(--accent);font-weight:600;font:inherit;font-weight:600}
input[type=email]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%;width:100%}

.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gauge{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.gauge::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.gauge .n{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.gauge .t{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.gauge[aria-pressed="true"]{background:var(--cbg);border-color:var(--c)}
.gauge:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.g-over{--c:var(--over);--cbg:var(--over-bg)} .g-soon{--c:var(--soon);--cbg:var(--soon-bg)} .g-none{--c:var(--none);--cbg:var(--none-bg)} .g-ok{--c:var(--ok);--cbg:var(--ok-bg)}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px}
.tab{all:unset;cursor:pointer;padding:10px 12px;font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent)}
.filter{display:flex;align-items:center;gap:8px;padding-bottom:8px;font-size:14px;color:var(--ink-2)}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
textarea{resize:vertical;min-height:64px;width:100%}

.group{display:flex;flex-direction:column;gap:8px}
.group h2{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.05em;text-transform:uppercase;margin:8px 0 0;display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.group h2 .count{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border-radius:6px;padding:1px 7px;color:var(--ink-2)}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 18px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,1.2fr) auto;gap:6px 16px;align-items:center;position:relative;cursor:pointer}
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--c)}
.row:hover{border-color:var(--c)}
.s-over{--c:var(--over);--cbg:var(--over-bg)} .s-soon{--c:var(--soon);--cbg:var(--soon-bg)} .s-none{--c:var(--none);--cbg:var(--none-bg)} .s-ok{--c:var(--ok);--cbg:var(--ok-bg)}
.r-title{font-weight:600;line-height:1.3}
.r-asset{font-size:13px;color:var(--ink-2)}
.lbl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.cell{font-size:14px;min-width:0}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--cbg);color:var(--c);margin-top:2px;white-space:nowrap}
.odo{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 5px;letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--ink-2)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 22px;display:flex;flex-direction:column;gap:14px}
.empty h2{font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.empty p{margin:0;color:var(--ink-2);max-width:60ch}
.quick{display:flex;flex-wrap:wrap;gap:8px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{margin:0;font-size:17px;line-height:1.25}
.kind{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 6px;white-space:nowrap}
.dots{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.dots span{display:inline-flex;align-items:center;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.meter-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}

.hist{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hrow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:4px 14px;padding:10px 14px;border-top:1px solid var(--line);align-items:start}
.hrow:first-child{border-top:0}
.hdate{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);padding-top:2px;font-variant-numeric:tabular-nums}
.hnote{font-size:14px;color:var(--ink-2);margin-top:2px;overflow-wrap:anywhere}

.scrim{position:fixed;inset:0;background:rgba(10,16,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;width:100%;max-width:620px;max-height:calc(100% - 24px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 8px;position:sticky;top:0;background:var(--surface);z-index:1}
.sheet-head h2{margin:0;font-family:var(--f-display);font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.sheet-head .kicker{font-size:13px;color:var(--ink-2);margin-top:4px}
.sheet-body{padding:8px 20px 20px;display:flex;flex-direction:column;gap:14px}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:12px 20px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.x{all:unset;cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;border-radius:6px;color:var(--ink-2)}
.x:hover{background:var(--surface-2)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .flabel{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select{width:100%}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hint{font-size:13px;color:var(--ink-2);margin:0}
.presets{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.preset{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;padding:9px 12px;border-top:1px solid var(--line);align-items:start;cursor:pointer}
.preset:first-child{border-top:0}
.preset:hover{background:var(--surface-2)}
.preset input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.preset .pname{font-weight:500;font-size:14.5px}
.preset .ptip{grid-column:2/4;font-size:12.5px;color:var(--ink-2)}
.preset .pint{font-size:12.5px;color:var(--ink-2);white-space:nowrap;text-align:right}
.preset-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px;min-width:0}
.fact.status{background:var(--cbg)}
.fact.status strong{color:var(--c)}
.sec-title{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.05em;margin:4px 0 0;color:var(--ink-2)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:760px){
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row .cell{grid-column:1/2}
  .row .r-btn{grid-column:2;grid-row:1}
  .gauges{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:480px){
  .fields,.facts{grid-template-columns:minmax(0,1fr)}
  .hrow{grid-template-columns:minmax(0,1fr) auto}
  .hdate{grid-column:1/3}
  .brand h1{font-size:34px}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Upkeep <span>Ledger</span></h1>
      <p class="sub">Oil changes, filters, alarms and everything else the house, the cars and the gear need. Log it once and the whole family sees it.</p>
    </div>
    <div class="top-actions"><button id="householdBtn" class="btn" type="button" hidden>Household</button><button id="addThingBtn" class="btn primary" type="button" hidden>+ Add a thing</button></div>
  </header>

  
  <section class="gauges" id="gauges" hidden aria-label="Status summary">
    <button class="gauge g-over" data-f="over" type="button" aria-pressed="false"><span class="n" id="n-over">0</span><span class="t">Overdue</span></button>
    <button class="gauge g-soon" data-f="soon" type="button" aria-pressed="false"><span class="n" id="n-soon">0</span><span class="t">Due soon</span></button>
    <button class="gauge g-none" data-f="none" type="button" aria-pressed="false"><span class="n" id="n-none">0</span><span class="t">Never logged</span></button>
    <button class="gauge g-ok" data-f="ok" type="button" aria-pressed="false"><span class="n" id="n-ok">0</span><span class="t">Up to date</span></button>
  </section>

  <div class="bar" hidden>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-v="due" aria-selected="true" type="button">Due list</button>
      <button class="tab" role="tab" data-v="things" aria-selected="false" type="button">Things</button>
      <button class="tab" role="tab" data-v="history" aria-selected="false" type="button">History</button>
    </nav>
    <div class="filter">
      <label for="assetFilter">Show</label>
      <select id="assetFilter"><option value="all">Everything</option></select>
    </div>
  </div>

  <main id="view">
    <div class="empty"><h2>Loading the ledger</h2><p>Your family's maintenance records will appear here in a moment.</p></div>
  </main>
</div>

<div id="modal" class="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---------- Task library ----------
   Intervals are common manufacturer and industry guidance; every one can be edited per task.
   Preset rows: [name, everyDays, everyMeter, checkedByDefault, tip] */
const KINDS = {

    ["Renew registration", 365, 0, 1, ""],
    ["State inspection / emissions", 365, 0, 0, ""],
    ["Replace brake fluid", 730, 30000, 0, ""],
    ["Wheel alignment", 730, 0, 0, "Sooner if the car pulls or tires wear unevenly."],
    ["Inspect belts and hoses", 365, 0, 0, ""],
    ["Flush coolant", 1825, 60000, 0, ""],
    ["Change transmission fluid", 0, 60000, 0, ""],
    ["Change differential / transfer case fluid", 0, 50000, 0, "AWD and 4x4 vehicles."],
    ["Replace spark plugs", 0, 100000, 0, ""],
    ["Replace timing belt", 0, 100000, 0, "Only if the engine has a belt rather than a chain."],
    ["Wash and wax", 90, 0, 0, ""]
  ]},
  generator: { label: "Generator", unit: "hr", presets: [
    ["Change oil", 365, 100, 1, "Do the first change after 20 to 30 hours of break-in."],
    ["Clean or replace air filter", 180, 50, 1, ""],
    ["Replace spark plug", 365, 100, 1, ""],

  yard: { label: "Lawn & yard", unit: "hr", presets: [

    ["Replace spark plug", 365, 100, 1, ""],
    ["Clean mower deck underside", 30, 0, 0, ""],

    ["Service snow blower (oil, plug, shear pins)", 365, 0, 0, "Before the first snow."],

    ["Replace fuel / water separator filter", 365, 100, 0, ""],

/* ---------- Status ---------- */
function logsByTask() {
  const m = new Map();
  for (const l of S.logs.values()) { if (!m.has(l.taskId)) m.set(l.taskId, []); m.get(l.taskId).push(l); }
  for (const arr of m.values()) arr.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  return m;
}
function statusOf(task, asset, logs) {

  if (!last) return st;
  const t = today();
  if (task.days) { st.dueDate = addDays(last.date, task.days); st.daysLeft = daysBetween(t, st.dueDate); }
  if (task.meter && st.unit) {
    const lm = logs.find(l => typeof l.meter === "number");
    if (lm) { st.dueMeter = lm.meter + task.meter; st.meterLeft = st.dueMeter - Math.max(asset.meter || 0, lm.meter); }
  }
  const soonDays = task.days ? Math.max(1, Math.min(14, Math.round(task.days * 0.2))) : 0;
  const over = (st.daysLeft != null && st.daysLeft < 0) || (st.meterLeft != null && st.meterLeft <= 0);
  const soon = (st.daysLeft != null && st.daysLeft <= soonDays) || (st.meterLeft != null && st.meterLeft <= task.meter * 0.1);

}

  if (st.meterLeft != null) bits.push(st.meterLeft <= 0 ? `${fmtNum(-st.meterLeft)} ${st.unit} over` : `${fmtNum(st.meterLeft)} ${st.unit} left`);

  return bits.join(" · ");
}
const RANK = { over: 0, soon: 1, none: 2, ok: 3 };
function computeRows() {
  const lb = logsByTask(); const rows = [];
  for (const task of S.tasks.values()) {
    const asset = S.assets.get(task.assetId); if (!asset) continue;
    const logs = lb.get(task.id) || [];
    rows.push({ task, asset, logs, st: statusOf(task, asset, logs) });
  }
  const urgency = r => {
    const d = r.st.daysLeft != null ? r.st.daysLeft : 1e6;
    const m = r.st.meterLeft != null && r.task.meter ? (r.st.meterLeft / r.task.meter) * (r.task.days || 365) : 1e6;

  return rows;
}

function closeSheet() { $("#modal").hidden = true; $("#sheet").replaceChildren(); if (lastFocus && lastFocus.isConnected) lastFocus.focus(); }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modal").hidden) closeSheet(); });
function field(label, input, id) { input.id = id; return h("div", { class: "field" }, h("label", { for: id }, label), input); }
function confirmBtn(label, action) {
  let armed = false, timer;
  const b = h("button", { class: "btn small danger", type: "button" }, label);
  b.addEventListener("click", async () => {
    if (!armed) { armed = true; b.classList.add("armed"); b.textContent = "Tap again to confirm"; timer = setTimeout(() => { armed = false; b.classList.remove("armed"); b.textContent = label; }, 3500); return; }
    clearTimeout(timer); b.disabled = true; await action(b); b.disabled = false; armed = false; b.classList.remove("armed"); b.textContent = label;
  });
  return b;
}
function numOrNull(v) { const n = parseFloat(String(v).replace(/,/g, "")); return Number.isFinite(n) && n >= 0 ? n : null; }

/* ---------- Thing (asset) sheet ---------- */
function presetList(kindKey, unit, existingNames, preCheck = true) {
  const presets = (KINDS[kindKey]?.presets || []).filter(p => !existingNames.has(p[0].toLowerCase()));
  if (!presets.length) return { el: h("p", { class: "hint" }, existingNames.size ? "Every suggested task is already on the list. Add your own below." : "No suggested tasks for this kind of thing. Add your own after saving."), get: () => [] };
  const boxes = [];
  const list = h("div", { class: "presets" }, presets.map((p, i) => {
    const meter = presetMeter(kindKey, p[2], unit);
    const cb = h("input", { type: "checkbox", id: `pre-${i}` }); cb.checked = preCheck && !!p[3]; boxes.push([cb, p, meter]);
    return h("label", { class: "preset", for: `pre-${i}` }, cb, h("span", { class: "pname" }, p[0]), h("span", { class: "pint" }, fmtEvery(p[1], meter, unit)), p[4] ? h("span", { class: "ptip" }, p[4]) : null);
  }));
  const all = h("button", { class: "btn ghost small", type: "button", onclick: () => { const on = boxes.some(([cb]) => !cb.checked); boxes.forEach(([cb]) => cb.checked = on); all.textContent = on ? "Clear all" : "Select all"; } }, "Select all");
  return {
    el: h("div", { class: "field" }, h("div", { class: "preset-tools" }, h("span", { class: "flabel" }, "Suggested tasks"), all), list,
      h("p", { class: "hint" }, "Intervals are typical guidance. Your owner's manual wins; you can change any interval later.")),
    get: () => boxes.filter(([cb]) => cb.checked).map(([, p, meter]) => ({ name: p[0], days: p[1] || null, meter: meter || null, notes: p[4] || "" }))
  };
}
function openThing(assetId, kindKey) {
  const a = assetId ? S.assets.get(assetId) : null;
  const kind = h("select", null, Object.entries(KINDS).map(([k, v]) => h("option", { value: k }, v.label)));
  kind.value = a?.kind || kindKey || "home";
  const name = h("input", { type: "text", placeholder: "e.g. Mom's Highlander", maxlength: "80" }); name.value = a?.name || "";
  const detail = h("input", { type: "text", placeholder: "Year, make, model, location", maxlength: "120" }); detail.value = a?.detail || "";
  const unit = h("select", null, Object.entries(UNIT_NAMES).map(([k, v]) => h("option", { value: k }, v)));
  unit.value = a ? (a.unit || "") : KINDS[kind.value].unit;
  const reading = h("input", { type: "number", min: "0", step: "1", inputmode: "numeric", placeholder: "Current reading" }); reading.value = a?.meter ?? "";
  const readingField = field("Current reading", reading, "f-reading");
  const presetBox = h("div");
  let presets = { get: () => [] };
  const defaultName = k => k === "home" ? "Home" : "";
  const refresh = () => {
    readingField.hidden = !unit.value;
    if (!a) { presets = presetList(kind.value, unit.value, new Set()); presetBox.replaceChildren(presets.el); }
  };
  kind.addEventListener("change", () => { unit.value = KINDS[kind.value].unit; if (!name.value || name.value === "Home") name.value = defaultName(kind.value); refresh(); });
  unit.addEventListener("change", refresh);
  if (!a && !name.value) name.value = defaultName(kind.value);
  refresh();

  const save = h("button", { class: "btn primary", type: "button" }, a ? "Save changes" : "Add it");
  save.addEventListener("click", async () => {
    const nm = name.value.trim();
    if (!nm) { name.focus(); toast("Give it a name first."); return; }
    save.disabled = true;
    const meter = unit.value ? numOrNull(reading.value) : null;
    const body = { name: nm, kind: kind.value, detail: detail.value.trim(), unit: unit.value, meter, meterDate: meter != null ? (a?.meter === meter ? a.meterDate || today() : today()) : null };
    const ok = await write(async () => {
      if (a) { await upd("assets", a.id, body); }
      else {
        const [row] = await ins("assets", body);
        const picks = presets.get();
        if (picks.length) await ins("tasks", picks.map(t => ({ ...t, assetId: row.id })));
      }
    }, a ? "Saved" : `${nm} added`);
    if (ok) closeSheet(); else save.disabled = false;
  });
  const foot = [];
  if (a) foot.push(confirmBtn("Delete", async () => {
    const ok = await write(async () => { await del("assets", a.id); await Promise.all([load("tasks"), load("logs")]); }, `${a.name} deleted`);
    if (ok) closeSheet();
  }), h("span", { style: "flex:1" }));
  foot.push(h("button", { class: "btn", type: "button", onclick: closeSheet }, "Cancel"), save);
  openSheet(a ? "Edit thing" : "Add a thing", a ? (a.detail || KINDS[a.kind]?.label) : "The house, a car, the generator, the mower…",
    [h("div", { class: "fields" }, field("Kind", kind, "f-kind"), field("Name", name, "f-name")),
     field("Details (optional)", detail, "f-detail"),
     h("div", { class: "fields" }, field("Tracks", unit, "f-unit"), readingField),
     a ? h("p", { class: "hint" }, "Deleting a thing also removes its tasks and history.") : presetBox], foot);
}

/* ---------- Add tasks to an existing thing ---------- */
function openAddTasks(assetId) {
  const a = S.assets.get(assetId);
  const existing = new Set([...S.tasks.values()].filter(t => t.assetId === assetId).map(t => t.name.toLowerCase()));
  const presets = presetList(a.kind, a.unit, existing, false);
  const save = h("button", { class: "btn primary", type: "button" }, "Add selected");
  save.addEventListener("click", async () => {
    const picks = presets.get();
    if (!picks.length) { toast("Tick at least one task, or create your own."); return; }
    save.disabled = true;
    const ok = await write(() => ins("tasks", picks.map(t => ({ ...t, assetId }))), `${plural(picks.length, "task")} added`);
    if (ok) closeSheet(); else save.disabled = false;
  });
  openSheet("Add tasks", a.name, [presets.el],
    [h("button", { class: "btn", type: "button", onclick: () => openTaskForm(null, assetId) }, "Create my own"), h("span", { style: "flex:1" }), h("button", { class: "btn", type: "button", onclick: closeSheet }, "Cancel"), save]);
}

/* ---------- Custom / edit task ---------- */
function openTaskForm(taskId, assetId) {
  const t = taskId ? S.tasks.get(taskId) : null;
  const a = S.assets.get(t ? t.assetId : assetId);
  const name = h("input", { type: "text", maxlength: "100", placeholder: "e.g. Replace water filter under sink" }); name.value = t?.name || "";
  const days = h("input", { type: "number", min: "0", step: "1", inputmode: "numeric", placeholder: "e.g. 90" }); days.value = t?.days ?? "";
  const meter = h("input", { type: "number", min: "0", step: "1", inputmode: "numeric", placeholder: a.unit === "hr" ? "e.g. 100" : "e.g. 5000" }); meter.value = t?.meter ?? "";
  const notes = h("textarea", { maxlength: "500", placeholder: "Part numbers, filter size, oil type, who services it…" }); notes.value = t?.notes || "";
  const save = h("button", { class: "btn primary", type: "button" }, t ? "Save changes" : "Add task");
  save.addEventListener("click", async () => {
    const nm = name.value.trim(); if (!nm) { name.focus(); toast("Name the task first."); return; }
    const d = numOrNull(days.value), m = numOrNull(meter.value);
    const body = { name: nm, days: d ? Math.round(d) : null, meter: a.unit && m ? m : null, notes: notes.value.trim() };
    save.disabled = true;
    const ok = await write(() => t ? upd("tasks", t.id, body) : ins("tasks", { ...body, assetId: a.id }), t ? "Saved" : "Task added");
    if (ok) { closeSheet(); if (t) openTask(t.id); } else save.disabled = false;
  });
  openSheet(t ? "Edit task" : "New task", a.name,
    [field("Task", name, "f-tname"),
     h("div", { class: "fields" }, field("Repeat every (days)", days, "f-days"), a.unit ? field(`…or every (${a.unit})`, meter, "f-meter") : h("div")),
     h("p", { class: "hint" }, a.unit ? "Fill in one or both. The task comes due at whichever arrives first." : "Leave blank for a one-off or as-needed task."),
     field("Notes (optional)", notes, "f-notes")],
    [h("button", { class: "btn", type: "button", onclick: closeSheet }, "Cancel"), save]);
}

/* ---------- Log sheet ---------- */
function openLog(taskId) {
  const t = S.tasks.get(taskId), a = S.assets.get(t.assetId);
  const logs = logsByTask().get(taskId) || [];
  const date = h("input", { type: "date", max: today() }); date.value = today();
  const reading = h("input", { type: "number", min: "0", step: "1", inputmode: "numeric", placeholder: a.meter != null ? `Last known ${fmtNum(a.meter)}` : "Current reading" });
  const note = h("textarea", { maxlength: "500", placeholder: "Brand, part number, shop, cost… (optional)" });
  const save = h("button", { class: "btn primary", type: "button" }, "Save entry");
  save.addEventListener("click", async () => {
    if (!date.value) { date.focus(); toast("Pick the date it was done."); return; }
    const m = a.unit ? numOrNull(reading.value) : null;
    save.disabled = true;
    const ok = await write(async () => {
      await ins("logs", { taskId, assetId: a.id, taskName: t.name, date: date.value, meter: m, note: note.value.trim() });
      if (m != null && (a.meter == null || m > a.meter)) await upd("assets", a.id, { meter: m, meterDate: date.value });
    }, "Logged");
    if (ok) closeSheet(); else save.disabled = false;
  });
  const last = logs[0];
  openSheet("Log it", `${t.name} · ${a.name}`,
    [last ? h("p", { class: "hint" }, `Last done ${fmtDate(last.date)}${last.by ? " by " + who(last.by) : ""}.`) : null,
     h("div", { class: "fields" }, field("Date done", date, "f-date"), a.unit ? field(a.unit === "hr" ? "Hour meter reading" : "Odometer reading", reading, "f-lreading") : h("div")),
     field("Notes", note, "f-lnote")],
    [h("button", { class: "btn", type: "button", onclick: closeSheet }, "Cancel"), save]);
}

/* ---------- Meter sheet ---------- */
function openMeter(assetId) {
  const a = S.assets.get(assetId);
  const reading = h("input", { type: "number", min: "0", step: "1", inputmode: "numeric" }); reading.value = a.meter ?? "";
  const save = h("button", { class: "btn primary", type: "button" }, "Save reading");
  save.addEventListener("click", async () => {
    const m = numOrNull(reading.value); if (m == null) { reading.focus(); toast("Enter a number."); return; }
    save.disabled = true;
    const ok = await write(() => upd("assets", a.id, { meter: m, meterDate: today() }), "Reading saved");
    if (ok) closeSheet(); else save.disabled = false;
  });
  openSheet(a.unit === "hr" ? "Update hour meter" : "Update odometer", a.name,
    [field(`Current reading (${a.unit})`, reading, "f-mreading"),
     h("p", { class: "hint" }, "Mileage- and hour-based tasks use this to work out what's due.")],
    [h("button", { class: "btn", type: "button", onclick: closeSheet }, "Cancel"), save]);
}

/* ---------- Task detail sheet ---------- */
function openTask(taskId) {
  const t = S.tasks.get(taskId); if (!t) return;
  const a = S.assets.get(t.assetId);
  const logs = logsByTask().get(taskId) || [];
  const st = statusOf(t, a, logs);
  const facts = h("div", { class: "facts" },
    h("div", { class: `fact status s-${st.code}` }, h("span", { class: "lbl" }, "Status"), h("strong", null, pillText(st))),
    h("div", { class: "fact" }, h("span", { class: "lbl" }, "Schedule"), fmtEvery(t.days, t.meter, a.unit)),
    h("div", { class: "fact" }, h("span", { class: "lbl" }, "Last done"), st.last ? [fmtDate(st.last.date), st.last.by ? ` by ${who(st.last.by)}` : ""] : "No record yet"),
    h("div", { class: "fact" }, h("span", { class: "lbl" }, "Next due"), st.dueDate || st.dueMeter != null ? [st.dueDate ? fmtDate(st.dueDate) : "", st.dueDate && st.dueMeter != null ? " or " : "", st.dueMeter != null ? odo(st.dueMeter, a.unit) : ""] : "Log it once to start the clock"));
  const hist = logs.length ? h("div", { class: "hist" }, logs.map(histRow)) : h("p", { class: "hint" }, "No entries yet.");
  openSheet(t.name, a.name + (a.detail ? ` · ${a.detail}` : ""),
    [facts, t.notes ? h("div", null, h("span", { class: "lbl" }, "Notes"), h("div", { class: "hnote", style: "color:var(--ink)" }, t.notes)) : null,
     h("h3", { class: "sec-title" }, `History (${logs.length})`), hist],
    [confirmBtn("Delete task", async () => { const ok = await write(() => del("tasks", t.id), "Task deleted"); if (ok) closeSheet(); }),
     h("span", { style: "flex:1" }),
     h("button", { class: "btn", type: "button", onclick: () => openTaskForm(t.id) }, "Edit"),
     h("button", { class: "btn primary", type: "button", onclick: () => openLog(t.id) }, "Log it")]);
}

/* ---------- Household sheet: your name, family, invites, sign out ---------- */
function openHousehold() {
  const owner = S.role === "owner";
  const me = S.members.find(m => m.user_id === S.uid);
  const myName = h("input", { type: "text", maxlength: "60", placeholder: "What the family calls you" }); myName.value = me?.display_name || "";
  const saveName = h("button", { class: "btn small", type: "button" }, "Save name");
  saveName.addEventListener("click", async () => {
    saveName.disabled = true;
    await write(async () => { await q(S.sb.from("household_members").update({ display_name: myName.value.trim() || null }).eq("household_id", hid()).eq("user_id", S.uid)); await loadMembers(); }, "Name saved");
    saveName.disabled = false;
  });
  const people = h("div", { class: "hist" }, S.members.map(m => h("div", { class: "hrow member" },
    h("div", { style: "min-width:0" }, h("div", { class: "r-title" }, m.user_id === S.uid ? `${m.display_name || "You"} (you)` : (m.display_name || "No name yet")), h("div", { class: "r-asset" }, m.email || "")),
    h("span", { class: "kind" }, m.role === "owner" ? "Owner" : "Family"),
    owner && m.user_id !== S.uid ? confirmBtn("Remove", async b => { if (await write(async () => { await q(S.sb.from("household_members").delete().eq("household_id", hid()).eq("user_id", m.user_id)); await loadMembers(); }, "Removed")) b.closest(".hrow")?.remove(); }) : h("span"))));
  const pending = S.invites.length ? h("div", { class: "hist" }, S.invites.map(i => h("div", { class: "hrow member" },
    h("div", { style: "min-width:0" }, h("div", { class: "r-title" }, i.email), h("div", { class: "r-asset" }, "Invited, hasn't signed in yet")),
    h("span"),
    owner ? confirmBtn("Cancel", async b => { if (await write(async () => { await q(S.sb.from("household_invites").delete().eq("household_id", hid()).eq("email", i.email)); await loadMembers(); }, "Invite cancelled")) b.closest(".hrow")?.remove(); }) : h("span")))) : null;
  const invite = h("input", { type: "email", placeholder: "family@example.com", autocomplete: "off" });
  const sendInvite = h("button", { class: "btn small primary", type: "button" }, "Invite");
  sendInvite.addEventListener("click", async () => {
    const e = invite.value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { invite.focus(); toast("Enter a full email address."); return; }
    sendInvite.disabled = true;
    const ok = await write(async () => { await q(S.sb.from("household_invites").insert({ household_id: hid(), email: e })); await loadMembers(); }, "Invited");
    sendInvite.disabled = false;
    if (ok) openHousehold();
  });
  openSheet(S.household.name, `Signed in as ${S.email}`,
    [h("div", { class: "field" }, h("label", { for: "f-myname" }, "Your name"), h("div", { class: "inline" }, Object.assign(myName, { id: "f-myname" }), saveName)),
     h("h3", { class: "sec-title" }, `Family (${S.members.length})`), people,
     owner ? [h("div", { class: "field" }, h("label", { for: "f-invite" }, "Invite someone"), h("div", { class: "inline" }, Object.assign(invite, { id: "f-invite" }), sendInvite),
       h("p", { class: "hint" }, "Tell them to open the ledger and sign in with that email. They'll join automatically. The app doesn't send the invite for you.")),
       pending ? [h("h3", { class: "sec-title" }, "Waiting to join"), pending] : null] : h("p", { class: "hint" }, "Only the household owner can invite or remove people.")],
    [h("button", { class: "btn", type: "button", onclick: signOut }, "Sign out"), h("span", { style: "flex:1" }), h("button", { class: "btn primary", type: "button", onclick: closeSheet }, "Done")]);
}

/* ---------- Controls ---------- */
function setView(v) { S.view = v; try { history.replaceState(null, "", "#" + v); } catch (e) {} render(); }
function saveFilter() { try { localStorage.setItem("ul-asset", S.asset); } catch (e) {} }
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => setView(t.dataset.v)));
document.querySelectorAll(".gauge").forEach(g => g.addEventListener("click", () => { S.status = S.status === g.dataset.f ? null : g.dataset.f; if (S.view !== "due") S.view = "due"; render(); }));
$("#assetFilter").addEventListener("change", e => { S.asset = e.target.value; saveFilter(); render(); });
$("#addThingBtn").addEventListener("click", () => openThing(null, S.assets.size ? "vehicle" : "home"));
$("#householdBtn").addEventListener("click", openHousehold);

/* ---------- Session ---------- */
async function signOut() {
  closeSheet();
  if (S.channel) { S.sb.removeChannel(S.channel); S.channel = null; }
  await S.sb.auth.signOut();
}
function resetData() {
  Object.assign(S, { session: null, uid: null, household: null, role: "member", members: [], invites: [], assets: new Map(), tasks: new Map(), logs: new Map(), loaded: false });
}
let startingFor = null;
async function startSession(session) {
  if (startingFor === session.user.id || (S.uid === session.user.id && S.phase === "app")) return;
  startingFor = session.user.id;
  S.session = session; S.uid = session.user.id; S.email = session.user.email || "";
  try { await q(S.sb.rpc("claim_invites")); } catch (e) { console.warn("claim_invites", e); }
  await loadHousehold();
  startingFor = null;
}
async function loadHousehold() {
  try {
    const mem = await q(S.sb.from("household_members").select("role, households(id, name)").eq("user_id", S.uid).order("joined_at").limit(1));
    if (!mem.length || !mem[0].households) { S.phase = "setup"; render(); return; }
    S.household = mem[0].households; S.role = mem[0].role; S.phase = "app"; S.loaded = false;
    render();
    await Promise.all([loadMembers(), load("assets"), load("tasks"), load("logs")]);
    S.loaded = true; subscribe(); render();
    const me = S.members.find(m => m.user_id === S.uid);
    if (me && !me.display_name) { toast("Add your name so the family knows who logged what."); openHousehold(); }
  } catch (e) {
    console.error(e); toast("The ledger didn't load. Check your connection and reload.");
  }
}
(async () => {
  render();
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase) { S.phase = "config"; render(); return; }
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  S.sb.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT") { resetData(); S.phase = "signin"; render(); return; }
    if (session && (event === "SIGNED_IN" || event === "INITIAL_SESSION")) setTimeout(() => startSession(session), 0);
    else if (event === "INITIAL_SESSION") { S.phase = "signin"; render(); }
  });
})();
</script>
